spring:
  server: 
    address: ${API_ADDRESS} 
    port: ${API_PORT}
  application:
    name: talis
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true 
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    servlet:
      path: /api/v1
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION}
      refresh-token:
        expiration: ${JWT_TOKEN_EXPIRATION}

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

