spring:
  server: 
    address: 0.0.0.0
  application:
    name: tasks
  datasource:
    url: jdbc:postgresql://localhost:5433/db
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true 
  mvc:
    servlet:
      path: /api/v1
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 
      refresh-token:
        expiration: 604800000 

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
